# ==============================================================================
# Phase 2: vLLM Migration & Concurrent Inference Configuration
# Objective: Measure continuous batching & concurrency under shared vLLM engine
# ==============================================================================

model:
  model_path: "Qwen/Qwen3-ASR-1.7B"
  max_new_tokens: 512
  sample_rate: 16000

vllm:
  gpu_memory_utilization: 0.7
  max_inference_batch_size: 1  # Intentionally 1 per transcribe() call to test vLLM request scheduling
  max_model_len: 4096

benchmark:
  test_file: "data/test.jsonl"
  audio_dir: "data/audio_clips/test"
  output_dir: "phase2/results"
  concurrencies: [1, 2, 4, 8, 16, 32, 64]
  warmup_requests: 3
  success_criterion:
    primary_target_p95_rtf: 0.5
    strong_target_p95_rtf: 0.3

monitoring:
  gpu_device_index: 0
  sample_interval_s: 0.05
